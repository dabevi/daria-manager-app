<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План дня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f1ec);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #22201c);
    --hint: var(--tg-theme-hint-color, #8a847a);
    --accent: var(--tg-theme-button-color, #7a5cff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 96px; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { margin: 4px 2px 16px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .date { color: var(--hint); font-size: 14px; }
  .bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--hint) 25%, transparent);
         margin-top: 12px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--hint);
       margin: 22px 4px 8px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  li { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px;
       border-bottom: 1px solid color-mix(in srgb, var(--hint) 18%, transparent); cursor: pointer; }
  li:last-child { border-bottom: 0; }
  .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--hint);
         display: grid; place-items: center; margin-top: 1px; transition: all .15s; }
  li.done .box { background: var(--accent); border-color: var(--accent); }
  li.done .box::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-text);
                        border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  li.done .t { color: var(--hint); text-decoration: line-through; }
  .who { font-size: 12px; color: var(--hint); }
  .empty { color: var(--hint); text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  // План приходит в ссылке: #d=<base64url(JSON)>  {title, date, items:[{id, text, who}]}
  // Данных на странице нет; отметки уходят боту через Telegram.WebApp.sendData.
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function decode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  }

  const app = document.getElementById('app');
  let plan = null;
  try { plan = decode(new URLSearchParams(location.hash.slice(1)).get('d') || ''); } catch (e) {}

  if (!plan || !plan.items) {
    app.innerHTML = '<p class="empty">План откроется из бота менеджера.</p>';
  } else {
    const done = new Set(plan.done || []);
    const groups = { 'Дарья': [], 'менеджеры': [] };
    plan.items.forEach(it => (it.who === 'Дарья' ? groups['Дарья'] : groups['менеджеры']).push(it));

    app.innerHTML = `<header><h1>${esc(plan.title || 'План дня')}</h1>
      <div class="date">${esc(plan.date || '')}</div><div class="bar"><i id="bar"></i></div></header>`;
    for (const [name, items] of Object.entries(groups)) {
      if (!items.length) continue;
      const h = document.createElement('h2');
      h.textContent = name === 'Дарья' ? 'Для тебя' : 'Делают менеджеры';
      app.appendChild(h);
      const ul = document.createElement('ul');
      items.forEach(it => {
        const li = document.createElement('li');
        li.className = done.has(it.id) ? 'done' : '';
        li.innerHTML = `<span class="box"></span><div><div class="t">${esc(it.text)}</div>` +
                       (it.who && it.who !== 'Дарья' ? `<div class="who">${esc(it.who)}</div>` : '') + '</div>';
        li.onclick = () => {
          done.has(it.id) ? done.delete(it.id) : done.add(it.id);
          li.classList.toggle('done');
          tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
          update();
        };
        ul.appendChild(li);
      });
      app.appendChild(ul);
    }

    function update() {
      document.getElementById('bar').style.width = (100 * done.size / plan.items.length) + '%';
      if (tg) {
        tg.MainButton.setText(`Отправить менеджеру (${done.size}/${plan.items.length})`);
        tg.MainButton.show();
      }
    }
    if (tg) tg.MainButton.onClick(() => tg.sendData(JSON.stringify({ plan: plan.date, done: [...done] })));
    update();
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
</script>
</body>
</html>
